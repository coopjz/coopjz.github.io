name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-homepage
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          ref: master
          path: .pages
      - name: Validate reviewed content before replacing any published files
        run: python3 scripts/prepare_feed.py content/feed.json --previous .pages/feed.json
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run build
      - name: Publish static files to the existing Pages branch
        run: |
          git -C .pages rm -rq --ignore-unmatch -- . ':(exclude).github/**'
          cp -a dist/. .pages/
          touch .pages/.nojekyll
          # Retire the obsolete raw-feed scheduler if it was previously installed.
          rm -f .pages/.github/workflows/feed-refresh.yml
          git -C .pages config user.name 'github-actions[bot]'
          git -C .pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .pages add -A
          if ! git -C .pages diff --cached --quiet; then
            git -C .pages commit -qm "Deploy homepage from ${GITHUB_SHA}"
            git -C .pages push origin HEAD:master
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
