name: Feed browser QA
on:
  push:
    branches: [feat/research-feed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/prepare_feed.py content/feed.json
      - run: npm run build
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Exercise desktop and mobile production UI
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/feed-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/feed-browser.mjs
      - name: Verify invalid research cannot replace published data
        run: |
          cp public/feed.json /tmp/last-published-feed.json
          printf '{"schemaVersion":2,"mode":"assistant-reviewed","items":[]}' > /tmp/invalid-feed.json
          if python3 scripts/prepare_feed.py /tmp/invalid-feed.json; then exit 1; fi
          cmp public/feed.json /tmp/last-published-feed.json
          echo 'PASS: invalid research leaves the previous content byte-for-byte unchanged.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-browser-screenshots
          path: test-results/

